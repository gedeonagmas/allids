services:
  redis:
    image: redis:8-alpine
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 2s
      retries: 5

  postgres:
    image: postgres:15-alpine
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: '${POSTGRES_USER:-allids}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:-allidsdotone}'
      POSTGRES_DB: '${POSTGRES_DB:-allids}'
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', '${POSTGRES_USER:-allids}']
      interval: 5s
      timeout: 2s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.admin
    depends_on:
      - redis
    ports:
      - '${ADMIN_PORT:-3001}:3001'
    environment:
      ADMIN_PORT: '${ADMIN_PORT:-3001}'
      PORT: 3001
      HOSTNAME: 0.0.0.0
      NODE_ENV: development
      NODE_OPTIONS: '--max-old-space-size=4096'
      NEXT_PUBLIC_API_URL: '${NEXT_PUBLIC_API_URL:-http://localhost:4000}'
      NEXT_TELEMETRY_DISABLED: '1'
    volumes:
      - ./:/workspace:delegated
    command: pnpm --filter admin dev

  user:
    build:
      context: .
      dockerfile: docker/Dockerfile.user
    depends_on:
      - redis
    ports:
      - '${USER_PORT:-3000}:3000'
    environment:
      USER_PORT: '${USER_PORT:-3000}'
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NODE_ENV: development
      NODE_OPTIONS: '--max-old-space-size=4096'
      NEXT_PUBLIC_API_URL: '${NEXT_PUBLIC_API_URL:-http://localhost:4000}'
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_FIREBASE_API_KEY: '${NEXT_PUBLIC_FIREBASE_API_KEY}'
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: '${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}'
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: '${NEXT_PUBLIC_FIREBASE_PROJECT_ID}'
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: '${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}'
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}'
      NEXT_PUBLIC_FIREBASE_APP_ID: '${NEXT_PUBLIC_FIREBASE_APP_ID}'
    volumes:
      - ./:/workspace:delegated
    command: pnpm --filter user dev

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    depends_on:
      - redis
      - postgres
    ports:
      - '${API_PORT:-4000}:4000'
    environment:
      API_PORT: '${API_PORT:-4000}'
      PORT: 4000
      HOSTNAME: 0.0.0.0
      NODE_OPTIONS: '--max-old-space-size=4096'
      REDIS_URL: '${REDIS_URL:-redis://redis:6379}'
      DATABASE_URL: '${DATABASE_URL:-postgresql://allids:allidsdotone@postgres:5432/allids}'
      NODE_ENV: development
      FIREBASE_PROJECT_ID: '${FIREBASE_PROJECT_ID}'
      FIREBASE_API_KEY: '${FIREBASE_API_KEY}'
      FIREBASE_AUTH_DOMAIN: '${FIREBASE_AUTH_DOMAIN}'
      FIREBASE_STORAGE_BUCKET: '${FIREBASE_STORAGE_BUCKET}'
      FIREBASE_MESSAGING_SENDER_ID: '${FIREBASE_MESSAGING_SENDER_ID}'
      FIREBASE_APP_ID: '${FIREBASE_APP_ID}'
    volumes:
      - ./:/workspace:delegated
    command: pnpm --filter api dev

volumes:
  postgres-data: