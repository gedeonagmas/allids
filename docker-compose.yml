services:
  redis:
    image: redis:8-alpine
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 2s
      retries: 5

  postgres:
    image: postgres:15-alpine
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: '${POSTGRES_USER:-allids}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:-allidsdotone}'
      POSTGRES_DB: '${POSTGRES_DB:-allids}'
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', '${POSTGRES_USER:-allids}']
      interval: 5s
      timeout: 2s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.admin
    depends_on:
      - redis
    ports:
      - '${ADMIN_PORT:-3001}:3001'
    environment:
      ADMIN_PORT: '${ADMIN_PORT:-3001}'
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: 'http://api:4000'
      NEXT_TELEMETRY_DISABLED: '1'
    volumes:
      - ./:/workspace:delegated
      - pnpm-node-modules:/workspace/node_modules
    command: sh -c 'pnpm --filter admin dev --hostname 0.0.0.0 --port $ADMIN_PORT'

  user:
    build:
      context: .
      dockerfile: docker/Dockerfile.user
    depends_on:
      - redis
    ports:
      - '${USER_PORT:-3000}:3000'
    environment:
      USER_PORT: '${USER_PORT:-3000}'
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: 'http://api:4000'
      NEXT_TELEMETRY_DISABLED: '1'
    volumes:
      - ./:/workspace:delegated
      - pnpm-node-modules:/workspace/node_modules
    command: sh -c 'pnpm --filter user dev --hostname 0.0.0.0 --port $USER_PORT'

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    depends_on:
      - redis
      - postgres
    ports:
      - '${API_PORT:-4000}:4000'
    environment:
      API_PORT: '${API_PORT:-4000}'
      REDIS_URL: '${REDIS_URL:-redis://redis:6379}'
      DATABASE_URL: '${DATABASE_URL:-postgresql://allids:allidsdotone@postgres:5432/allids}'
      NODE_ENV: development
    volumes:
      - ./:/workspace:delegated
      - pnpm-node-modules:/workspace/node_modules
    command: sh -c 'pnpm --filter api dev --hostname 0.0.0.0 --port $API_PORT'

volumes:
  postgres-data:
  pnpm-node-modules:
